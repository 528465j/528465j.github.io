<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Nine-agent LangGraph document-generation workflow">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#654ea3" />
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c7a1c" />
    </marker>
  </defs>

  <rect width="1000" height="680" rx="16" fill="#fbfcfe" />
  <rect x="1" y="1" width="998" height="678" rx="15" fill="none" stroke="#e2e6ee" />

  <!-- header -->
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0e1116" letter-spacing="-0.5">Agentic document generation: nine-agent LangGraph state machine</text>
  <text x="40" y="80" font-size="15" fill="#6b7480">Agents exchange structured JSON contracts; the JD-analysis schema becomes the downstream tailoring checklist.</text>

  <!-- phase legend -->
  <g font-size="12.5" fill="#3a4250">
    <circle cx="600" cy="48" r="6" fill="#9b80da" /><text x="612" y="52">Acquire</text>
    <circle cx="700" cy="48" r="6" fill="#654ea3" /><text x="712" y="52">Create</text>
    <circle cx="792" cy="48" r="6" fill="#4a3680" /><text x="804" y="52">Assure &amp; ship</text>
  </g>

  <!-- connectors (drawn before nodes) -->
  <g fill="none" stroke="#654ea3" stroke-width="2.2">
    <line x1="290" y1="166" x2="369" y2="166" marker-end="url(#arr)" />
    <line x1="625" y1="166" x2="704" y2="166" marker-end="url(#arr)" />
    <path d="M835,212 C835,252 165,252 165,294" marker-end="url(#arr)" />
    <line x1="290" y1="346" x2="369" y2="346" marker-end="url(#arr)" />
    <line x1="625" y1="346" x2="704" y2="346" marker-end="url(#arr)" />
    <path d="M835,392 C835,440 165,440 165,474" marker-end="url(#arr)" />
    <line x1="290" y1="526" x2="369" y2="526" marker-end="url(#arr)" />
    <line x1="625" y1="526" x2="704" y2="526" marker-end="url(#arr)" />
  </g>

  <!-- feedback loop: QA audit -> generation -->
  <path d="M210,480 C300,432 430,430 500,394" fill="none" stroke="#9c7a1c" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrD)" />
  <text x="300" y="452" font-size="12.5" fill="#9c7a1c" font-weight="600">revise until audit score plateaus</text>

  <!-- nodes -->
  <!-- Row 1: Acquire (#9b80da) -->
  <g>
    <rect x="40" y="120" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="70" cy="150" r="15" fill="#9b80da" /><text x="70" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="96" y="156" font-size="18" font-weight="600" fill="#0e1116">JD acquisition</text>
    <text x="22" y="188" font-size="13" fill="#6b7480"><tspan x="62">Fetch job description</tspan></text>
  </g>
  <g>
    <rect x="375" y="120" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="405" cy="150" r="15" fill="#9b80da" /><text x="405" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="431" y="156" font-size="18" font-weight="600" fill="#0e1116">JD analysis</text>
    <text x="397" y="188" font-size="13" fill="#6b7480">Skills · keywords · seniority</text>
  </g>
  <g>
    <rect x="710" y="120" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="740" cy="150" r="15" fill="#9b80da" /><text x="740" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="766" y="156" font-size="18" font-weight="600" fill="#0e1116">Company research</text>
    <text x="732" y="188" font-size="13" fill="#6b7480">Web search · cached</text>
  </g>

  <!-- Row 2: Create (#654ea3) -->
  <g>
    <rect x="40" y="300" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="70" cy="330" r="15" fill="#654ea3" /><text x="70" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="96" y="336" font-size="18" font-weight="600" fill="#0e1116">Fit assessment</text>
    <text x="62" y="368" font-size="13" fill="#6b7480">Comparative match</text>
  </g>
  <g>
    <rect x="375" y="300" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="405" cy="330" r="15" fill="#654ea3" /><text x="405" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <text x="431" y="336" font-size="18" font-weight="600" fill="#0e1116">Generation</text>
    <text x="397" y="368" font-size="13" fill="#6b7480">Tailored to JD checklist</text>
  </g>
  <g>
    <rect x="710" y="300" width="250" height="92" rx="14" fill="#ffffff" stroke="#654ea3" stroke-width="1.8" />
    <circle cx="740" cy="330" r="15" fill="#654ea3" /><text x="740" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
    <text x="766" y="336" font-size="18" font-weight="600" fill="#0e1116">Claims-map check</text>
    <text x="732" y="368" font-size="13" fill="#9c7a1c" font-weight="600">Truthfulness gate</text>
  </g>

  <!-- Row 3: Assure &amp; ship (#4a3680) -->
  <g>
    <rect x="40" y="480" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="70" cy="510" r="15" fill="#4a3680" /><text x="70" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text>
    <text x="96" y="516" font-size="18" font-weight="600" fill="#0e1116">QA audit</text>
    <text x="62" y="548" font-size="13" fill="#6b7480">Iterative revision</text>
  </g>
  <g>
    <rect x="375" y="480" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="405" cy="510" r="15" fill="#4a3680" /><text x="405" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text>
    <text x="431" y="516" font-size="18" font-weight="600" fill="#0e1116">LaTeX render</text>
    <text x="397" y="548" font-size="13" fill="#6b7480">Typeset documents</text>
  </g>
  <g>
    <rect x="710" y="480" width="250" height="92" rx="14" fill="#ffffff" stroke="#dfe4ee" />
    <circle cx="740" cy="510" r="15" fill="#4a3680" /><text x="740" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">9</text>
    <text x="766" y="516" font-size="18" font-weight="600" fill="#0e1116">Versioned storage</text>
    <text x="732" y="548" font-size="13" fill="#6b7480">Google Drive, versioned</text>
  </g>

  <!-- footer annotations -->
  <line x1="40" y1="608" x2="960" y2="608" stroke="#e2e6ee" />
  <text x="40" y="636" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="#3a4250">Reliability: thread-safe parallel ThreadPoolExecutor · exponential backoff · idempotent versioned outputs</text>
  <text x="40" y="658" font-family="'IBM Plex Mono', monospace" font-size="12.5" fill="#3a4250">Observability: per-row cost tracking · processing-time logging · email failure alerts   |   I/O: Google Sheets · Drive · Docs</text>
</svg>
