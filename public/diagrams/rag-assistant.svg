<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Retrieval-Augmented Azure OpenAI assistant pipeline">
  <defs>
    <marker id="rarr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#654ea3" />
    </marker>
    <marker id="rarrD" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c7a1c" />
    </marker>
  </defs>

  <rect width="1000" height="620" rx="16" fill="#fbfcfe" />
  <rect x="1" y="1" width="998" height="618" rx="15" fill="none" stroke="#e2e6ee" />

  <!-- header -->
  <text x="40" y="50" font-size="24" font-weight="700" fill="#0e1116" letter-spacing="-0.5">Retrieval-Augmented Azure OpenAI assistant</text>
  <text x="40" y="78" font-size="15" fill="#6b7480">Staff query products, policies and procedures in plain language; operations &amp; support iterate prompts, chunking and retrieval.</text>

  <!-- lane labels -->
  <text x="40" y="116" font-family="'IBM Plex Mono', monospace" font-size="12.5" letter-spacing="2" fill="#654ea3">INGESTION · OFFLINE</text>

  <!-- ingestion connectors -->
  <g fill="none" stroke="#654ea3" stroke-width="2.2">
    <line x1="240" y1="167" x2="269" y2="167" marker-end="url(#rarr)" />
    <line x1="475" y1="167" x2="504" y2="167" marker-end="url(#rarr)" />
    <line x1="710" y1="167" x2="739" y2="167" marker-end="url(#rarr)" />
    <path d="M845,206 C845,250 700,272 644,294" marker-end="url(#rarr)" />
    <path d="M430,353 C430,388 375,392 375,410" marker-end="url(#rarr)" />
  </g>
  <text x="724" y="250" font-size="12" fill="#6b7480">store vectors</text>
  <text x="250" y="392" font-size="12" fill="#6b7480">retrieve top-k</text>

  <!-- query connectors -->
  <g fill="none" stroke="#654ea3" stroke-width="2.2">
    <line x1="240" y1="453" x2="269" y2="453" marker-end="url(#rarr)" />
    <line x1="475" y1="453" x2="504" y2="453" marker-end="url(#rarr)" />
    <line x1="710" y1="453" x2="739" y2="453" marker-end="url(#rarr)" />
    <line x1="845" y1="492" x2="845" y2="538" marker-end="url(#rarr)" />
  </g>

  <!-- feedback loop (dashed) -->
  <path d="M600,596 L22,596 L22,167 L36,167" fill="none" stroke="#9c7a1c" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#rarrD)" />
  <text x="250" y="589" font-size="12.5" font-weight="600" fill="#9c7a1c">guides content curation</text>

  <!-- ingestion nodes (y 128, h 78) -->
  <g>
    <rect x="40" y="128" width="200" height="78" rx="13" fill="#ffffff" stroke="#dfe4ee" />
    <text x="60" y="166" font-size="17" font-weight="600" fill="#0e1116">Internal sources</text>
    <text x="60" y="190" font-size="12.5" fill="#6b7480">products · policies · procedures</text>
  </g>
  <g>
    <rect x="275" y="128" width="200" height="78" rx="13" fill="#ffffff" stroke="#dfe4ee" />
    <text x="295" y="160" font-size="17" font-weight="600" fill="#0e1116">Consolidate</text>
    <text x="295" y="180" font-size="12.5" fill="#6b7480">dedupe · standardise</text>
    <text x="295" y="197" font-size="12.5" fill="#6b7480">align metadata</text>
  </g>
  <g>
    <rect x="510" y="128" width="200" height="78" rx="13" fill="#ffffff" stroke="#dfe4ee" />
    <text x="530" y="166" font-size="17" font-weight="600" fill="#0e1116">Chunk</text>
    <text x="530" y="190" font-size="12.5" fill="#6b7480">tuned overlap</text>
  </g>
  <g>
    <rect x="745" y="128" width="200" height="78" rx="13" fill="#ffffff" stroke="#dfe4ee" />
    <text x="765" y="166" font-size="17" font-weight="600" fill="#0e1116">Embeddings</text>
    <text x="765" y="190" font-size="12.5" fill="#6b7480">dense vectors</text>
  </g>

  <!-- vector store (center) -->
  <g>
    <rect x="350" y="275" width="300" height="78" rx="14" fill="#ece7f7" stroke="#654ea3" stroke-width="1.8" />
    <text x="500" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#4a3680">Vector store</text>
    <text x="500" y="332" text-anchor="middle" font-size="13" fill="#3a4250">Azure Blob Storage · low-latency retrieval</text>
  </g>

  <text x="40" y="402" font-family="'IBM Plex Mono', monospace" font-size="12.5" letter-spacing="2" fill="#654ea3">QUERY · ONLINE</text>

  <!-- query nodes (y 414, h 78) -->
  <g>
    <rect x="40" y="414" width="200" height="78" rx="13" fill="#ffffff" stroke="#dfe4ee" />
    <text x="60" y="452" font-size="17" font-weight="600" fill="#0e1116">Staff question</text>
    <text x="60" y="476" font-size="12.5" fill="#6b7480">plain language</text>
  </g>
  <g>
    <rect x="275" y="414" width="200" height="78" rx="13" fill="#ffffff" stroke="#dfe4ee" />
    <text x="295" y="452" font-size="17" font-weight="600" fill="#0e1116">Retrieve</text>
    <text x="295" y="476" font-size="12.5" fill="#6b7480">context-aware top-k</text>
  </g>
  <g>
    <rect x="510" y="414" width="200" height="78" rx="13" fill="#ffffff" stroke="#654ea3" stroke-width="1.8" />
    <text x="530" y="452" font-size="17" font-weight="600" fill="#0e1116">Azure OpenAI</text>
    <text x="530" y="476" font-size="12.5" fill="#6b7480">grounded chat answer</text>
  </g>
  <g>
    <rect x="745" y="414" width="200" height="78" rx="13" fill="#ffffff" stroke="#dfe4ee" />
    <text x="765" y="452" font-size="17" font-weight="600" fill="#0e1116">Grounded answer</text>
    <text x="765" y="476" font-size="12.5" fill="#6b7480">returned to staff</text>
  </g>

  <!-- feedback node -->
  <g>
    <rect x="600" y="538" width="360" height="58" rx="13" fill="#faf3df" stroke="#d8be86" />
    <text x="620" y="565" font-size="15" font-weight="600" fill="#7a5e12">Usage analytics &amp; feedback logging</text>
    <text x="620" y="583" font-size="12" fill="#8a6d1f">tracks adoption · surfaces information gaps</text>
  </g>
</svg>
