<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="glow" cx="82%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#9b80da" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#9b80da" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0e0e10" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="0" y="0" width="1200" height="8" fill="#9b80da" />

  <text x="80" y="150" fill="#b9a6e8" font-family="'IBM Plex Mono', monospace" font-size="26" letter-spacing="6">DATA · AI · ANALYTICS · SYDNEY</text>

  <text x="76" y="296" fill="#ede8dc" font-size="150" font-weight="700" letter-spacing="-5">Jatin Jassi</text>

  <text x="80" y="372" fill="#aba498" font-size="40" font-weight="500">Data, Analytics &amp; AI · telco · healthcare · consulting</text>

  <!-- metric chips -->
  <g font-family="'IBM Plex Mono', monospace" font-size="28" fill="#ede8dc">
    <rect x="80" y="430" width="220" height="64" rx="14" fill="#17171a" stroke="#2a2824" />
    <text x="190" y="471" text-anchor="middle">98% faster</text>
    <rect x="320" y="430" width="210" height="64" rx="14" fill="#17171a" stroke="#2a2824" />
    <text x="425" y="471" text-anchor="middle">37h to 8h</text>
    <rect x="550" y="430" width="240" height="64" rx="14" fill="#17171a" stroke="#2a2824" />
    <text x="670" y="471" text-anchor="middle">+12% accuracy</text>
  </g>

  <!-- work rights (green) -->
  <g>
    <rect x="80" y="520" width="560" height="58" rx="29" fill="#0f2a1c" stroke="#2f9e63" />
    <text x="110" y="558" fill="#6ee7a3" font-size="26" font-weight="500"><tspan font-weight="700">Full-time</tspan> unrestricted · Subclass 485</text>
  </g>

  <!-- data bars motif -->
  <g fill="#9b80da">
    <rect x="980" y="470" width="34" height="80" rx="6" opacity="0.55" />
    <rect x="1028" y="430" width="34" height="120" rx="6" opacity="0.75" />
    <rect x="1076" y="380" width="34" height="170" rx="6" />
  </g>
</svg>
